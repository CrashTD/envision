[package]
name = "envision"
version = "0.0.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.86"
gettext-rs = { version = "0.7.0", features = ["gettext-system"] }
git2 = "0.19.0"
gtk = { package = "gtk4", version = "0.9.0", features = ["v4_10"] }
lazy_static = "1.5.0"
adw = { package = "libadwaita", version = "0.7.0", features = ["v1_5"] }
libmonado = "1.3.0"
rusb = "0.9.4"
nix = { version = "0.29.0", features = ["fs", "signal"] }
relm4 = { version = "0.9.1", features = ["libadwaita"] }
relm4-components = "0.9.1"
reqwest = { version = "0.12.5", features = ["blocking"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
keyvalues-serde = "0.2.1"
tracker = "0.2.2"
uuid = { version = "1.10.0", features = ["v4", "fast-rng"] }
vte4 = { version = "0.8.0", features = ["v0_72"] }
xdg = "2.5.2"
openxr = { version = "0.19.0", features = ["linked"] }
ash = "0.38.0"
sha2 = "0.10.8"
tokio = { version = "1.39.3", features = ["process"] }
notify-rust = "4.11.3"
zbus = { version = "5.1.1", features = ["tokio"] }
