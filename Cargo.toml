[package]
name = "envision"
version = "3.2.0"
edition = "2024"
authors = [
    "Gabriele Musco <gabmus@disroot.org>",
]
description = "Orchestrator for the free XR stack"
repository = "https://gitlab.com/gabmus/envision"
documentation = "https://gitlab.com/gabmus/envision"
license = "AGPL-3.0-or-later"
keywords = ["desktop", "linux", "vr", "xr", "gtk"]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.86"
gettext-rs = { version = "0.7.0", features = ["gettext-system"] }
git2 = "0.20.4"
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_10"] }
lazy_static = "1.5.0"
adw = { package = "libadwaita", version = "0.8.1", features = ["v1_5"] }
libmonado = { version = "1.6.0", features = ["rc"] }
rusb = "0.9.4"
nix = { version = "0.31.2", features = ["fs", "signal"] }
relm4 = { version = "0.10.0", features = ["libadwaita"] }
relm4-components = "0.10.0"
reqwest = { version = "0.13.2", features = ["blocking"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
keyvalues-serde = "0.2.1"
tracker = "0.2.2"
uuid = { version = "1.10.0", features = ["v4", "fast-rng"] }
vte4 = { version = "0.9.0", features = ["v0_72"] }
xdg = "3.0.0"
openxr = { version = "0.22.0", features = ["linked"] }
ash = "0.38.0"
sha2 = "0.10.8"
tokio = { version = "1.39.3", features = ["process"] }
notify-rust = "4.11.3"
zbus = { version = "5.1.1", features = ["tokio"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
serde_yaml = "0.9.34"
delicious-adwaita = { version = "0.3.2", features = ["all_themes"] }
freedesktop-desktop-entry = "0.8.1"
